# Example Secret manifest — DO NOT commit real values.
#
# In GitOps the real Secret is either sealed (SealedSecrets), encrypted
# (SOPS + age) or synced from an external manager (External Secrets Operator
# pulling from GCP Secret Manager). This file documents the *shape* only.
#
# Create it in-cluster once, outside version control:
#   kubectl -n carecare create secret generic api-secrets \
#     --from-literal=DJANGO_SECRET_KEY=... \
#     --from-literal=DATABASE_URL=... \
#     --from-literal=REDIS_URL=... \
#     --from-literal=SENTRY_DSN=...
apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
  namespace: carecare
type: Opaque
stringData:
  DJANGO_SECRET_KEY: 'REPLACE_ME'
  DATABASE_URL: 'postgres://USER:PASSWORD@HOST:5432/carecare'
  REDIS_URL: 'redis://HOST:6379/0'
  SENTRY_DSN: ''
