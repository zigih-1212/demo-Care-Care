# Worker + beat deployments (Celery). Same hardening posture as the API.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: carecare
  labels:
    app.kubernetes.io/name: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: REGISTRY/carecare-api:IMAGE_TAG
          command:
            - celery
            - -A
            - carecare
            - worker
            - -l
            - info
            - --concurrency=4
            - --max-tasks-per-child=200
          envFrom:
            - configMapRef: { name: api-config }
            - secretRef: { name: api-secrets }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ['ALL'] }
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { cpu: '1', memory: 512Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beat
  namespace: carecare
  labels:
    app.kubernetes.io/name: beat
spec:
  # Beat must be a singleton; two schedulers would double-fire every task.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: beat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: beat
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: beat
          image: REGISTRY/carecare-api:IMAGE_TAG
          command: ['celery', '-A', 'carecare', 'beat', '-l', 'info']
          envFrom:
            - configMapRef: { name: api-config }
            - secretRef: { name: api-secrets }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ['ALL'] }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 250m, memory: 256Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
