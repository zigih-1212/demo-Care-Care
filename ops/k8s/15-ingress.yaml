# Ingress with TLS termination, rate limiting and security headers.
#
# NOTE: annotations assume ingress-nginx; cert-manager issues the certificate.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  namespace: carecare
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/proxy-body-size: '1m'
    # Edge rate limiting complements app-level DRF throttling.
    nginx.ingress.kubernetes.io/limit-rps: '20'
    nginx.ingress.kubernetes.io/limit-burst-multiplier: '5'
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "Strict-Transport-Security: max-age=63072000; includeSubDomains; preload";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
spec:
  ingressClassName: nginx
  tls:
    - hosts: [api.carecare.example.com]
      secretName: api-tls
  rules:
    - host: api.carecare.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
