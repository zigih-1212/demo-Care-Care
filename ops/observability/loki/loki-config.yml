# Loki configuration — ships container logs and indexes only cheap labels.
# Tenant data never leaves the cluster; logs go to a GCS bucket backend.
auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    gcs:
      bucket_name: carecare-loki-logs
  replication_factor: 1

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: gcs
      schema: v13
      index:
        prefix: loki_index_
        period: 24h

limits_config:
  # Keep cardinality under control: only these labels become index keys.
  max_label_names_per_series: 20
  retention_period: 720h # 30 days
  ingestion_rate_mb: 10
  ingestion_burst_size_mb: 20

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: gcs

ruler:
  alertmanager_url: http://alertmanager:9093
