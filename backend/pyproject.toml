[project]
name = "carecare-backend"
version = "0.1.0"
description = "Cara Care demo - digital therapeutic backend (IBS/GERD symptom tracking + therapy programs)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

dependencies = [
    "django>=5.1,<5.2",
    "djangorestframework>=3.15,<3.16",
    "djangorestframework-simplejwt>=5.3,<6.0",
    "django-cors-headers>=4.4,<5.0",
    "django-filter>=24.3,<25.0",
    "django-environ>=0.11,<0.12",
    "drf-spectacular>=0.27,<0.28",
    "psycopg[binary]>=3.2,<4.0",
    "celery[redis]>=5.4,<6.0",
    "redis>=5.0,<6.0",
    "django-prometheus>=2.3,<3.0",
    "gunicorn>=23.0,<24.0",
    "uvicorn[standard]>=0.32,<0.33",
    "python-json-logger>=2.0,<3.0",
    "argon2-cffi>=23.1,<24.0",
    "sentry-sdk[django]>=2.18,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-django>=4.9,<5.0",
    "pytest-cov>=6.0,<7.0",
    "pytest-xdist>=3.6,<4.0",
    "factory-boy>=3.3,<4.0",
    "freezegun>=1.5,<2.0",
    "ruff>=0.8,<0.9",
    "mypy>=1.13,<2.0",
    "django-stubs>=5.1,<6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["carecare", "apps", "common"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "DJ",       # flake8-django
    "UP",       # pyupgrade
    "S",        # flake8-bandit (security)
    "SIM",      # flake8-simplify
    "RET",      # flake8-return
    "TID",      # flake8-tidy-imports
]
ignore = [
    "E501",     # line length handled by formatter
    "S101",     # assert allowed in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "DJ"]
"*/migrations/*" = ["E", "W", "F", "I", "DJ"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "carecare.settings.test"
python_files = ["test_*.py", "*_test.py"]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
    "integration: integration tests touching multiple layers",
    "security: security-focused tests",
]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
# Third-party libs below ship no type information; DRF in particular has no
# official stubs, so requiring typed imports would block all progress for no
# correctness gain. django-stubs covers our own Django usage.
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true
check_untyped_defs = true
show_error_codes = true
exclude = ["migrations/", "\\.venv/"]

[[tool.mypy.overrides]]
# Tests lean on pytest fixtures whose types mypy cannot infer; checking them
# adds noise without catching real bugs.
module = ["tests.*"]
disallow_untyped_defs = false
ignore_errors = true

[tool.django-stubs]
django_settings_module = "carecare.settings.test"
