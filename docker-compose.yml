# Local development stack.
#
# Mirrors production wiring (Postgres + Redis + API + worker) so behaviour gaps
# only show up in the local-first developer experience, not between envs.
#
# NOTE: This file requires Docker, which is NOT installed in the authoring
# environment — it is shipped as an inspectable artifact, see TRUST.md.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: carecare
      POSTGRES_USER: carecare
      POSTGRES_PASSWORD: carecare_dev_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U carecare -d carecare']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      DJANGO_SETTINGS_MODULE: carecare.settings.prod
      DATABASE_URL: postgres://carecare:carecare_dev_password@db:5432/carecare
      REDIS_URL: redis://redis:6379/0
      DJANGO_SECRET_KEY: dev-only-not-a-real-secret-change-me-please
      DJANGO_DEBUG: 'false'
      DJANGO_ALLOWED_HOSTS: 'localhost,127.0.0.1,api'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '8000:8000'

  worker:
    build:
      context: ./backend
    command:
      - celery
      - -A
      - carecare
      - worker
      - -l
      - info
      - --concurrency=2
    environment:
      DJANGO_SETTINGS_MODULE: carecare.settings.prod
      DATABASE_URL: postgres://carecare:carecare_dev_password@db:5432/carecare
      REDIS_URL: redis://redis:6379/0
      DJANGO_SECRET_KEY: dev-only-not-a-real-secret-change-me-please
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: ./backend
    command:
      - celery
      - -A
      - carecare
      - beat
      - -l
      - info
    environment:
      DJANGO_SETTINGS_MODULE: carecare.settings.prod
      DATABASE_URL: postgres://carecare:carecare_dev_password@db:5432/carecare
      REDIS_URL: redis://redis:6379/0
      DJANGO_SECRET_KEY: dev-only-not-a-real-secret-change-me-please
    depends_on:
      redis:
        condition: service_healthy

  migrate:
    build:
      context: ./backend
    command: ['python', 'manage.py', 'migrate', '--noinput']
    environment:
      DJANGO_SETTINGS_MODULE: carecare.settings.prod
      DATABASE_URL: postgres://carecare:carecare_dev_password@db:5432/carecare
      REDIS_URL: redis://redis:6379/0
      DJANGO_SECRET_KEY: dev-only-not-a-real-secret-change-me-please
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
